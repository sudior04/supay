name: supay
services:
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes: ["./deployments/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      gateway: {condition: service_healthy}
      portal: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Go.Dockerfile
      args: {SERVICE: gateway}
    environment:
      HTTP_ADDR: ":8080"
      USER_SERVICE_URL: http://user-service:8080
      COMMERCE_SERVICE_URL: http://commerce-service:8080
      WALLET_SERVICE_URL: http://wallet-service:8080
      JWT_SECRET: ${JWT_SECRET:-supay-local-development-secret-change-before-deploy-2026}
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      user-service: {condition: service_healthy}
      commerce-service: {condition: service_healthy}
      wallet-service: {condition: service_healthy}
    restart: unless-stopped
  portal:
    build: ./web/portal
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: ["nats-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-supay_user_local}
      POSTGRES_DB: user
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["user-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  user-migrate:
    image: migrate/migrate:v4.18.3
    volumes: ["./services/user-service/migrations:/migrations:ro"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://user:${USER_DB_PASSWORD:-supay_user_local}@user-db:5432/user?sslmode=disable"]
    command: ["up"]
    depends_on:
      user-db: {condition: service_healthy}
    restart: "no"
  user-service:
    build:
      context: .
      dockerfile: deployments/docker/Go.Dockerfile
      args: {SERVICE: "user-service"}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://user:${USER_DB_PASSWORD:-supay_user_local}@user-db:5432/user?sslmode=disable"
      DB_MAX_CONNECTIONS: "10"
      JWT_SECRET: ${JWT_SECRET:-supay-local-development-secret-change-before-deploy-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PIN_PEPPER: ${PIN_PEPPER:-supay-local-pin-pepper-change-before-deploy-2026}
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      user-db: {condition: service_healthy}
      user-migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  commerce-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${COMMERCE_DB_PASSWORD:-supay_commerce_local}
      POSTGRES_DB: commerce
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["commerce-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  commerce-migrate:
    image: migrate/migrate:v4.18.3
    volumes: ["./services/commerce-service/migrations:/migrations:ro"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://commerce:${COMMERCE_DB_PASSWORD:-supay_commerce_local}@commerce-db:5432/commerce?sslmode=disable"]
    command: ["up"]
    depends_on:
      commerce-db: {condition: service_healthy}
    restart: "no"
  commerce-service:
    build:
      context: .
      dockerfile: deployments/docker/Go.Dockerfile
      args: {SERVICE: "commerce-service"}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://commerce:${COMMERCE_DB_PASSWORD:-supay_commerce_local}@commerce-db:5432/commerce?sslmode=disable"
      USER_SERVICE_URL: http://user-service:8080
      DB_MAX_CONNECTIONS: "10"
      JWT_SECRET: ${JWT_SECRET:-supay-local-development-secret-change-before-deploy-2026}
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      commerce-db: {condition: service_healthy}
      commerce-migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  wallet-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:-supay_wallet_local}
      POSTGRES_DB: wallet
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["wallet-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  wallet-migrate:
    image: migrate/migrate:v4.18.3
    volumes: ["./services/wallet-service/migrations:/migrations:ro"]
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://wallet:${WALLET_DB_PASSWORD:-supay_wallet_local}@wallet-db:5432/wallet?sslmode=disable"]
    command: ["up"]
    depends_on:
      wallet-db: {condition: service_healthy}
    restart: "no"
  wallet-service:
    build:
      context: .
      dockerfile: deployments/docker/Go.Dockerfile
      args: {SERVICE: "wallet-service"}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://wallet:${WALLET_DB_PASSWORD:-supay_wallet_local}@wallet-db:5432/wallet?sslmode=disable"
      DB_MAX_CONNECTIONS: "10"
      JWT_SECRET: ${JWT_SECRET:-supay-local-development-secret-change-before-deploy-2026}
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      wallet-db: {condition: service_healthy}
      wallet-migrate: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  user-data:
  commerce-data:
  wallet-data:
  nats-data:
